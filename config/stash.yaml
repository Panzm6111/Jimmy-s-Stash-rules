# Jimmy Stash 公共订阅入口；由 tools/build_subscription.py 生成。
# 固定地址：https://raw.githubusercontent.com/Panzm6111/Jimmy-s-Stash-rules/main/config/stash.yaml
# JIMMY-STASH AD-20261020.4；18个原策略组、DNS、私人订阅接入保留。
# 已整合40款现有专项，11份响应JS使用原生URL加载；扩展域名规则默认启用。
# Safari打开https://example.com/jimmy-stash-check可手动开始15分钟排查；默认不记录。
# 新增example.com精确MITM仅供自检；自检成功不代表App开屏已去除。
# 脚本URL带公开版本参数以区分旧缓存，首次加载仍需联网。
# 建议每周手动刷新本配置，修复发布后立即刷新；规则集与机场每24小时尝试刷新。
# 不需另加App或expanded覆写；停用已额外添加的广告覆写，保留私人订阅/白名单。
# 当前需求统一为整合入口，不再要求逐App开关；原模块保留作维护来源与旧安装兼容。
# 各独立模块/JS保持原许可；来源与完整源码：https://github.com/Panzm6111/Jimmy-s-Stash-rules/blob/main/docs/SOURCES.md
# 私人机场URL只在设备本地覆写，不放到GitHub。总代理首次REJECT，需选择出口。
# 当前仅离线验证；真实Stash解析、MITM、脚本执行与广告效果待iPhone验收。
proxy-providers:
  机场:
    type: http
    url: https://example.invalid/REPLACE_ON_DEVICE
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 1800
mode: rule
log-level: warning
ipv6: false
allow-lan: false
dns:
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
