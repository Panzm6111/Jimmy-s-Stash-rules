name: 必要规则云端更新
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-rules.yml', 'tools/cloud_update.py']
permissions:
  contents: read
concurrency:
  group: public-rule-conversions
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch and convert only necessary public sources
        run: python tools/cloud_update.py refresh
      - run: python -m unittest discover -s tests -p test_maintenance.py -v
      - run: python -m unittest discover -s tests -p test_private_config.py -v
      - run: python -m unittest discover -s tests -p test_clash.py -v
      - run: python -m unittest discover -s tests -p test_auto_update.py -v
      - run: python -m unittest discover -s tests -p test_community.py -v
      - run: python -m unittest discover -s tests -p test_subscriptions.py -v
      - run: python tools/validate.py
      - name: Publish only verified converted public files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/cloud_update.py publish
